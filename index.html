<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back Office AI Assistant Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: staff back-office shell — header, summary strip, tab bar (Ask your data / Data checks / Activity log), main card, safeguards row. Field-green accent for an agricultural trade body. */
  :root {
    --bg: #f3f5f2; --panel: #ffffff; --ink: #1a1f1b; --muted: #5e665f; --line: #dfe4dd;
    --accent: #2f6b3f; --accent-soft: #e6f0e8; --accent-ink: #ffffff;
    --warn: #9a5b06; --warn-bg: #fcf0db; --crit: #a83232; --crit-bg: #fbe6e6; --ok: #2f6b3f; --ok-bg: #e6f0e8;
    --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif; --body: "Inter", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #131714; --panel: #1b201c; --ink: #e8ece8; --muted: #a3ada4; --line: #2c332d;
    --accent: #8fcf9e; --accent-soft: #1f3324; --accent-ink: #0f1a12;
    --warn: #f0c27a; --warn-bg: #3a2c14; --crit: #f2a3a3; --crit-bg: #3d1f1f; --ok: #8fcf9e; --ok-bg: #1f3324; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #131714; --panel: #1b201c; --ink: #e8ece8; --muted: #a3ada4; --line: #2c332d;
    --accent: #8fcf9e; --accent-soft: #1f3324; --accent-ink: #0f1a12;
    --warn: #f0c27a; --warn-bg: #3a2c14; --crit: #f2a3a3; --crit-bg: #3d1f1f; --ok: #8fcf9e; --ok-bg: #1f3324; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--body); }
  .wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .banner { font: 500 12px var(--mono); color: var(--muted); background: var(--panel); border: 1px dashed var(--line); padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
  h1 { font: 700 22px var(--display); margin: 0; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .py { font: 500 12px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .stat b { display: block; font: 600 20px var(--display); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12.5px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { font: 500 14px var(--body); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 14px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .count { font: 500 11px var(--mono); background: var(--crit-bg); color: var(--crit); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 18px; min-width: 0; }
  .searchbar { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .btn { font: 500 14px var(--body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font-size: 13px; }
  .btn.quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12.5px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .answer { margin-top: 16px; background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; }
  .label { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin: 0 0 6px; }
  .answer p { margin: 0; font-size: 15px; }
  .answer p.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 8px 10px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 9px 10px; vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rid { font: 500 12px var(--mono); color: var(--accent); }
  .flag { border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
  .flag.crit { border-left-color: var(--crit); }
  .flag.done { opacity: .6; border-left-color: var(--ok); }
  .flag-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
  .flag h3 { margin: 0; font: 600 15px var(--display); }
  .pill { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 4px; }
  .pill.crit { color: var(--crit); background: var(--crit-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .flag p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .flags { display: grid; gap: 10px; margin-top: 12px; }
  .intro { color: var(--muted); font-size: 13.5px; margin: 0; }
  .log div { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .log time { font: 500 12px var(--mono); color: var(--muted); }
  .safeguards { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .safe { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--muted); }
  .safe strong { color: var(--ink); display: block; margin-bottom: 2px; font-weight: 600; }
  .loading { color: var(--muted); padding: 24px 0; }
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } .side { display: none; } }
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
  .brand { font: 700 15px var(--display); padding: 4px 10px 16px; }
  .brand small { display: block; font: 500 11px var(--mono); color: var(--muted); letter-spacing: .04em; }
  .nav { font: 500 13.5px var(--body); color: var(--muted); padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; }
  .nav.active { background: var(--accent-soft); color: var(--accent); }
  .nav em { font-style: normal; font: 500 11px var(--mono); }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 12px var(--body); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
  .thinking { margin-top: 16px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13.5px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="root"><div class="wrap"><p class="loading">Loading the Back Office AI Assistant demo…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;

// ---------- Fictional sample data ----------
const COMPANIES = [
  { id: "C-101", name: "Cascade Orchard Co.", state: "Washington", product: "Apples", usContent: 92, signed: true },
  { id: "C-102", name: "Sierra Almond Growers", state: "California", product: "Almonds", usContent: 88, signed: true },
  { id: "C-103", name: "High Desert Honey", state: "Arizona", product: "Honey", usContent: 45, signed: true },
  { id: "C-104", name: "Big Sky Beef Jerky", state: "Montana", product: "Beef snacks", usContent: 81, signed: false },
  { id: "C-105", name: "Willamette Valley Hazelnuts", state: "Oregon", product: "Hazelnuts", usContent: 97, signed: true },
  { id: "C-106", name: "Rocky Mountain Grains", state: "Colorado", product: "Ancient grains", usContent: 74, signed: true },
  { id: "C-107", name: "Aloha Coffee Roasters", state: "Hawaii", product: "Coffee", usContent: 63, signed: true },
  { id: "C-108", name: "Snake River Potatoes", state: "Idaho", product: "Potato flakes", usContent: 95, signed: true },
  { id: "C-109", name: "Mesa Chile Company", state: "New Mexico", product: "Chile sauces", usContent: 58, signed: true },
  { id: "C-110", name: "Great Basin Dairy", state: "Utah", product: "Cheese", usContent: 90, signed: true }
];
const CLAIMS = [
  { id: "FM-2026-014", company: "C-101", program: "FundMatch", amount: 18400, budget: 25000, status: "Pending" },
  { id: "FM-2026-021", company: "C-102", program: "FundMatch", amount: 32750, budget: 30000, status: "Pending" },
  { id: "FM-2026-033", company: "C-105", program: "FundMatch", amount: 9200, budget: 15000, status: "Approved" },
  { id: "FM-2026-038", company: "C-108", program: "FundMatch", amount: 12600, budget: 20000, status: "Pending" },
  { id: "FM-2026-041", company: "C-110", program: "FundMatch", amount: 21500, budget: 22000, status: "Paid" },
  { id: "FM-2026-047", company: "C-107", program: "FundMatch", amount: 7400, budget: 10000, status: "Pending" },
  { id: "GC-2026-006", company: "C-106", program: "Global Connect", amount: 4800, budget: 6000, status: "Approved" },
  { id: "GC-2026-009", company: "C-109", program: "Global Connect", amount: 3900, budget: 5000, status: "Pending" },
  { id: "FM-2026-052", company: "C-103", program: "FundMatch", amount: 11300, budget: 15000, status: "Pending" }
];
const INVOICES = [
  { id: "INV-5512", company: "C-101", number: "CO-2026-118", amount: 6200 },
  { id: "INV-5513", company: "C-101", number: "CO-2026-119", amount: 12200 },
  { id: "INV-5520", company: "C-102", number: "SA-7781", amount: 16400 },
  { id: "INV-5521", company: "C-102", number: "SA-7781", amount: 16350 },
  { id: "INV-5530", company: "C-108", number: "SRP-0442", amount: 12600 },
  { id: "INV-5541", company: "C-107", number: "", amount: 7400 },
  { id: "INV-5550", company: "C-103", number: "HDH-221", amount: 11300 }
];
const SAMPLES = [
  "Which FundMatch claims over $10,000 are pending?",
  "Total approved claims",
  "Which claims are over budget?",
  "Which companies fail the 50% U.S. content rule?",
  "Pending claims from California"
];

const usd = (n) => "$" + n.toLocaleString("en-US");
const companyOf = (id) => COMPANIES.find((c) => c.id === id);
const timeNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// ---------- Question parsing and answering (stand-in for the AI query layer) ----------
function parseQuestion(q) {
  const s = q.toLowerCase();
  const f = {};
  if (s.includes("fundmatch") || s.includes("fund match")) f.program = "FundMatch";
  if (s.includes("global connect")) f.program = "Global Connect";
  ["pending", "approved", "paid"].forEach((st) => { if (s.includes(st)) f.status = st[0].toUpperCase() + st.slice(1); });
  const amt = s.match(/(over|above|more than|greater than|>)\s*\$?\s*([\d,]+)\s*(k)?/);
  if (amt) f.min = parseInt(amt[2].replace(/,/g, ""), 10) * (amt[3] ? 1000 : 1);
  const state = COMPANIES.map((c) => c.state).find((x) => s.includes(x.toLowerCase()));
  if (state) f.state = state;
  if (s.includes("over budget") || s.includes("exceed")) f.overBudget = true;
  f.eligibility = s.includes("50%") || s.includes("content") || s.includes("eligib");
  return f;
}

function answerQuestion(q) {
  const f = parseQuestion(q);
  if (f.eligibility) {
    const rows = COMPANIES.filter((c) => c.usContent < 50);
    return {
      text: rows.length
        ? `${rows.length} company ${rows.length === 1 ? "is" : "are"} below the 50% U.S. agricultural content rule: ${rows.map((c) => `${c.name} (${c.usContent}%)`).join(", ")}.`
        : "All companies meet the 50% U.S. agricultural content rule.",
      ids: rows.map((c) => c.id),
      head: ["Record", "Company", "State", "Product", "U.S. content"],
      rows: rows.map((c) => [c.id, c.name, c.state, c.product, c.usContent + "%"]),
      numCols: [4]
    };
  }
  let rows = CLAIMS.slice();
  if (f.program) rows = rows.filter((c) => c.program === f.program);
  if (f.status) rows = rows.filter((c) => c.status === f.status);
  if (f.min) rows = rows.filter((c) => c.amount > f.min);
  if (f.state) rows = rows.filter((c) => companyOf(c.company).state === f.state);
  if (f.overBudget) rows = rows.filter((c) => c.amount > c.budget);
  const total = rows.reduce((s, c) => s + c.amount, 0);
  const desc = [f.status && f.status.toLowerCase(), f.program, "claims", f.min && "over " + usd(f.min), f.state && "from " + f.state, f.overBudget && "above their approved budget"].filter(Boolean).join(" ");
  return {
    text: rows.length
      ? `There ${rows.length === 1 ? "is 1" : "are " + rows.length} ${desc}, totalling ${usd(total)}.`
      : `There are no ${desc} in program year 2026.`,
    ids: rows.map((c) => c.id),
    head: ["Record", "Company", "Program", "Amount", "Approved budget", "Status"],
    rows: rows.map((c) => [c.id, companyOf(c.company).name, c.program, usd(c.amount), usd(c.budget), c.status]),
    numCols: [3, 4]
  };
}

// ---------- Automated data checks ----------
function runChecks() {
  const flags = [];
  CLAIMS.filter((c) => c.amount > c.budget).forEach((c) => flags.push({
    sev: "crit", title: "Claim exceeds approved budget", rec: c.id,
    text: `${companyOf(c.company).name} claimed ${usd(c.amount)} against an approved budget of ${usd(c.budget)}.` }));
  const seen = {};
  INVOICES.forEach((i) => {
    if (!i.number) return;
    const key = i.company + "|" + i.number;
    if (seen[key]) {
      const first = INVOICES.find((x) => x.id === seen[key]);
      flags.push({ sev: "crit", title: "Possible duplicate invoice", rec: `${first.id} / ${i.id}`,
        text: `${companyOf(i.company).name} submitted invoice number ${i.number} twice (${usd(first.amount)} and ${usd(i.amount)}).` });
    } else seen[key] = i.id;
  });
  INVOICES.filter((i) => !i.number).forEach((i) => flags.push({
    sev: "warn", title: "Invoice number missing", rec: i.id,
    text: `${companyOf(i.company).name}'s invoice for ${usd(i.amount)} has no invoice number.` }));
  COMPANIES.filter((c) => !c.signed).forEach((c) => flags.push({
    sev: "warn", title: "Application not signed", rec: c.id,
    text: `${c.name}'s 2026 application is missing the authorised signer's e-signature.` }));
  COMPANIES.filter((c) => c.usContent < 50).forEach((c) => {
    const claim = CLAIMS.find((x) => x.company === c.id);
    flags.push({ sev: "crit", title: "Below 50% U.S. agricultural content", rec: c.id + (claim ? " / " + claim.id : ""),
      text: `${c.name} (${c.product}) reports ${c.usContent}% U.S. content${claim ? " and has a pending claim of " + usd(claim.amount) : ""}.` });
  });
  return flags.map((f, i) => ({ ...f, key: i, decision: null }));
}

// ---------- Components ----------
function Stats() {
  const pending = CLAIMS.filter((c) => c.status === "Pending");
  const items = [
    [COMPANIES.length, "member companies"],
    [CLAIMS.length, "claims this program year"],
    [pending.length, "claims pending"],
    [usd(pending.reduce((s, c) => s + c.amount, 0)), "pending value"]
  ];
  return (
    <div className="stats">
      {items.map(([v, l]) => <div className="stat" key={l}><b>{v}</b><span>{l}</span></div>)}
    </div>
  );
}

function ResultTable({ head, rows, numCols }) {
  if (!rows.length) return null;
  return (
    <div className="table-wrap">
      <table>
        <thead><tr>{head.map((h) => <th key={h}>{h}</th>)}</tr></thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r[0]}>
              {r.map((c, i) => (
                <td key={i} className={numCols.includes(i) ? "num" : ""}>
                  {i === 0 ? <span className="rid">{c}</span> : c}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AskPanel({ onAsk, query, setQuery, result, thinking }) {
  return (
    <section className="card" role="tabpanel" aria-labelledby="tab-ask">
      <form className="searchbar" onSubmit={(e) => { e.preventDefault(); onAsk(query); }}>
        <input type="search" id="q" aria-label="Question about program data" value={query}
          onChange={(e) => setQuery(e.target.value)} placeholder="e.g. Which FundMatch claims over $10,000 are pending?" autoComplete="off" />
        <button className="btn" type="submit">Ask</button>
      </form>
      <div className="chips">
        {SAMPLES.map((s) => (
          <button key={s} className="chip" type="button" onClick={() => { setQuery(s); onAsk(s); }}>{s}</button>
        ))}
      </div>
      {thinking && (
        <div className="thinking" role="status"><span className="spinner" aria-hidden="true"></span>Querying program records…</div>
      )}
      {result && !thinking && (
        <>
          <section className="answer">
            <p className="label">Answer</p>
            <p>{result.text}</p>
            <p className="note">
              Records used: {result.ids.length ? result.ids.join(", ") : "none"}. In production, an approved AI service turns the
              question into a database query and every figure is read from these records, never generated.
            </p>
          </section>
          <ResultTable head={result.head} rows={result.rows} numCols={result.numCols} />
        </>
      )}
    </section>
  );
}

function ChecksPanel({ flags, onDecide }) {
  return (
    <section className="card" role="tabpanel" aria-labelledby="tab-checks">
      <p className="intro">Automated checks run on every application, claim and invoice. Nothing is changed automatically: anything that affects eligibility or payments waits for a staff decision.</p>
      <div className="flags">
        {flags.map((f) => (
          <article key={f.key} className={"flag " + (f.decision ? "done" : f.sev)}>
            <div className="flag-top">
              <h3>{f.title}</h3>
              {f.decision
                ? <span className="pill ok">{f.decision}</span>
                : <span className={"pill " + f.sev}>{f.sev === "crit" ? "Needs staff review · affects payment" : "Needs staff review"}</span>}
            </div>
            <p>{f.text}</p>
            <p>Records: <span className="rid">{f.rec}</span></p>
            {!f.decision && (
              <div className="actions">
                <button className="btn ghost" type="button" onClick={() => onDecide(f.key, "Confirmed, sent back to member")}>Confirm issue</button>
                <button className="btn quiet" type="button" onClick={() => onDecide(f.key, "Dismissed by staff")}>Dismiss</button>
              </div>
            )}
          </article>
        ))}
      </div>
    </section>
  );
}

function LogPanel({ log }) {
  return (
    <section className="card" role="tabpanel" aria-labelledby="tab-log">
      <p className="intro">Every AI question and every staff decision is recorded.</p>
      <div className="log">
        {log.map((e, i) => <div key={i}><time>{e.t}</time><span>{e.text}</span></div>)}
      </div>
    </section>
  );
}

function Safeguards() {
  const items = [
    ["Answers traced to records", "Every answer lists the exact claim, invoice or company records it used."],
    ["Staff stay in control", "AI flags and suggests; staff approve anything affecting eligibility or payments."],
    ["Data stays yours", "AI services are disclosed, and WUSATA data is never used to train outside models."],
    ["Full audit trail", "Questions and decisions are logged by user and time."]
  ];
  return (
    <div className="safeguards">
      {items.map(([t, d]) => <div className="safe" key={t}><strong>{t}</strong>{d}</div>)}
    </div>
  );
}

function App() {
  const initialFlags = useMemo(runChecks, []);
  const [tab, setTab] = useState(() => {
    const h = window.location.hash.slice(1);
    return ["ask", "checks", "log"].includes(h) ? h : "ask";
  });
  const [query, setQuery] = useState(SAMPLES[0]);
  const [result, setResult] = useState(() => answerQuestion(SAMPLES[0]));
  const [flags, setFlags] = useState(initialFlags);
  const [log, setLog] = useState(() => [
    { t: timeNow(), text: `Question asked: “${SAMPLES[0]}”` },
    { t: timeNow(), text: `Automated checks ran: ${initialFlags.length} items flagged for review` }
  ]);

  const [thinking, setThinking] = useState(false);
  const addLog = useCallback((text) => setLog((l) => [{ t: timeNow(), text }, ...l]), []);

  const onAsk = (q) => {
    if (!q.trim()) return;
    setThinking(true);
    setTimeout(() => {
      setResult(answerQuestion(q));
      setThinking(false);
      addLog(`Staff user asked: “${q.trim()}”`);
    }, 900);
  };

  const onDecide = (key, decision) => {
    const f = flags.find((x) => x.key === key);
    setFlags((fs) => fs.map((x) => (x.key === key ? { ...x, decision } : x)));
    addLog(`Staff decision on ${f.rec}: ${decision.toLowerCase()} (${f.title.toLowerCase()})`);
  };

  const open = flags.filter((f) => !f.decision).length;
  const tabs = [["ask", "Ask your data"], ["checks", "Data checks"], ["log", "Activity log"]];

  const navItems = [["Dashboard"], ["Members", COMPANIES.length], ["Applications"], ["Claims", CLAIMS.length], ["Invoices", INVOICES.length], ["Events"], ["AI Assistant", null, true]];

  return (
    <div className="shell">
      <nav className="side" aria-label="Back Office">
        <div className="brand">Back Office<small>PROTOTYPE · SAMPLE DATA</small></div>
        {navItems.map(([label, n, active]) => (
          <div key={label} className={"nav" + (active ? " active" : "")} aria-current={active ? "page" : undefined}>
            <span>{label}</span>{n ? <em>{n}</em> : null}
          </div>
        ))}
      </nav>
      <div>
        <div className="topbar"><span><span className="status-dot"></span>All systems operational</span><span>Staff user</span><span className="avatar" aria-hidden="true">SU</span></div>
    <div className="wrap">
      <div className="banner">DEMO by TechTose for the WUSATA RFP · not affiliated with WUSATA · all companies, claims and invoices are fictional sample data · production version would use an approved AI service with no training on WUSATA data</div>
      <header>
        <div>
          <h1>Back Office AI Assistant</h1>
          <p className="sub">Ask plain-language questions about program data, and let automated checks flag issues for staff review.</p>
        </div>
        <span className="py">Program year 2026</span>
      </header>
      <Stats />
      <div className="tabs" role="tablist">
        {tabs.map(([id, label]) => (
          <button key={id} className="tab" role="tab" id={"tab-" + id} aria-selected={tab === id} onClick={() => setTab(id)}>
            {label}{id === "checks" && open > 0 && <span className="count">{open}</span>}
          </button>
        ))}
      </div>
      {tab === "ask" && <AskPanel onAsk={onAsk} query={query} setQuery={setQuery} result={result} thinking={thinking} />}
      {tab === "checks" && <ChecksPanel flags={flags} onDecide={onDecide} />}
      {tab === "log" && <LogPanel log={log} />}
      <Safeguards />
    </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</html>
